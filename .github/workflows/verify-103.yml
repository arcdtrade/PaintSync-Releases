name: Verify PaintSync 1.0.15 installer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-103.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paintsync-103-verification
  cancel-in-progress: false
jobs:
  verify-installation:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Download and verify the release files
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          repo=os.environ['GITHUB_REPOSITORY']
          releases=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100']))
          matches=[release for release in releases if release['name']=='PaintSync 1.0.15']
          assert len(matches)==1, 'Expected exactly one 1.0.15 release'
          release=matches[0]
          assert release['tag_name']=='v1.0.15' and not release['draft']
          expected={'PaintSync-Setup-1.0.15.exe': '7e35c16aee583f9482c1ed5c560744d4860fce224d7b2eaed33260e584ab4011', 'appcast.xml': '6f213ee92450188dd183ab54c57a83aef3bf5b9d76bbdb58cdf707a4ba619ce1', 'SHA256SUMS.txt': '7443d1048514d5449805ee424a302ebd47f723f9f9e76e90d0bf2fced84fabc0', 'Read-Me.txt': '0351cc93f18055a441966de718da1d608f003cf57f333da420374b30c5767934'}
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'paintsync-1015'
          root.mkdir()
          assets={a['name']:a for a in release['assets']}
          for name,digest in expected.items():
              asset=assets[name]
              with (root/name).open('wb') as output:
                  subprocess.run(['gh','api',f"repos/{repo}/releases/assets/{asset['id']}",'-H','Accept: application/octet-stream'],stdout=output,check=True)
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          ns='{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          item=ET.fromstring((root/'appcast.xml').read_bytes()).find('channel/item')
          enclosure=item.find('enclosure')
          assert item.find(ns+'version').text=='1.0.15'
          assert enclosure.attrib['url']==f'https://github.com/{repo}/releases/download/v1.0.15/PaintSync-Setup-1.0.15.exe'
          assert enclosure.attrib[ns+'installerArguments']=='/UPDATE'
          raw=(root/'PaintSync-Setup-1.0.15.exe').read_bytes()
          assert int(enclosure.attrib['length'])==len(raw)
          Ed25519PublicKey.from_public_bytes(base64.b64decode('VMLVwz8SJ4lwAMi9clASezBmvJEGIqqjgjkziTF5Lwk=')).verify(base64.b64decode(enclosure.attrib[ns+'edSignature']),raw)
          print('PASS: exact approved installer, feed, checksum, version and Ed25519 update signature.')
      - name: Test installation, activation gate, upgrade and uninstall
        shell: python
        run: |
          import ctypes, hashlib, json, os, pathlib, struct, subprocess, time, winreg
          from ctypes import wintypes
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'paintsync-1015'
          setup=root/'PaintSync-Setup-1.0.15.exe'
          install=pathlib.Path(os.environ['LOCALAPPDATA'])/'Programs/PaintSync'
          data=pathlib.Path(os.environ['USERPROFILE'])/'AppData/Local/PaintRelay'
          data.mkdir(parents=True,exist_ok=True)
          settings=data/'settings.ini'
          paints=root/'iRacing/paint';paints.mkdir(parents=True)
          sentinel=paints/'sentinel.tga';sentinel.write_bytes(b'KEEP PAINT')
          settings.write_text('[App]\nCustomerID=111111\nSeconds=0.5\nRoot='+str(paints)+'\n[Appearance]\nTheme=2\nLanguage=en\n[Updates]\nAutomatic=0\n[Document.Test]\nVehicle=trucks fordf150\n',encoding='utf-16')
          def run_setup(*args,expected=0):
              result=subprocess.run([str(setup),*args],timeout=90)
              assert result.returncode==expected,(result.returncode,expected)
          before=settings.read_bytes()
          run_setup('/S','/ID=0','/PLUGINS=none',expected=13)
          assert settings.read_bytes()==before
          import ctypes
          from ctypes import wintypes
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import time
          import winreg

          # This runs on a disposable Windows runner with the previous public installer.
          # Only processes created by this test are shut down.
          def verify_editor_prompt(old, new, temp, install, data):
              gui = ctypes.WinDLL('user32', use_last_error=True)
              visit_type = ctypes.WINFUNCTYPE(wintypes.BOOL, wintypes.HWND, wintypes.LPARAM)
              gui.GetWindowTextW.argtypes = [wintypes.HWND, wintypes.LPWSTR, ctypes.c_int]
              gui.GetWindowThreadProcessId.argtypes = [wintypes.HWND, ctypes.POINTER(wintypes.DWORD)]
              gui.GetDlgItem.argtypes = [wintypes.HWND, ctypes.c_int]
              gui.GetDlgItem.restype = wintypes.HWND
              gui.PostMessageW.argtypes = [wintypes.HWND, wintypes.UINT, wintypes.WPARAM, wintypes.LPARAM]
              gui.SendMessageW.argtypes = [wintypes.HWND, wintypes.UINT, wintypes.WPARAM, wintypes.LPARAM]
              gui.IsWindowVisible.argtypes = [wintypes.HWND]
              gui.EnumWindows.argtypes = [visit_type, wintypes.LPARAM]
              gui.EnumChildWindows.argtypes = [wintypes.HWND, visit_type, wintypes.LPARAM]

              def controls(process):
                  result = []
                  @visit_type
                  def window(hwnd, _):
                      pid = wintypes.DWORD()
                      gui.GetWindowThreadProcessId(hwnd, ctypes.byref(pid))
                      if pid.value == process.pid and gui.IsWindowVisible(hwnd):
                          @visit_type
                          def child(handle, _):
                              if gui.IsWindowVisible(handle):
                                  text = ctypes.create_unicode_buffer(1024)
                                  gui.GetWindowTextW(handle, text, 1024)
                                  result.append((hwnd, handle, text.value))
                              return True
                          gui.EnumChildWindows(hwnd, child, 0)
                      return True
                  gui.EnumWindows(window, 0)
                  return result

              def wait_for(process, label):
                  deadline = time.monotonic() + 35
                  while time.monotonic() < deadline:
                      assert process.poll() is None, ('Setup exited', process.returncode, label)
                      for hwnd, handle, text in controls(process):
                          if label in text:
                              return hwnd, handle, text
                      time.sleep(.1)
                  raise AssertionError(('Missing Setup prompt', label, controls(process)))

              def click_button(hwnd, button_id):
                  button = gui.GetDlgItem(hwnd, button_id)
                  assert button and gui.PostMessageW(button, 0xF5, 0, 0), button_id

              def editor(name):
                  path = temp/(name+'.exe')
                  shutil.copyfile(Path(os.environ['SystemRoot'])/'System32/ping.exe', path)
                  return subprocess.Popen([str(path), '-t', '127.0.0.1'], stdout=subprocess.DEVNULL)

              def stopped(proc):
                  if proc and proc.poll() is None:
                      proc.terminate()
                      proc.wait(timeout=8)

              def digest(path):
                  return hashlib.sha256(path.read_bytes()).digest()

              subprocess.run([str(old), '/S','/ID=123456','/PLUGINS=none'],check=True,timeout=90)
              setup_registry = r'Software\PaintSync\Setup'
              adobe = Path(os.environ['APPDATA'])/'Adobe'
              panel = adobe/'CEP/extensions/com.drewtrader.paintsync.illustrator'
              (panel/'CSXS').mkdir(parents=True, exist_ok=True)
              (panel/'CSXS/manifest.xml').write_text('<ExtensionManifest ExtensionBundleVersion="0.2.7"/>')
              ps = adobe/'UXP/Plugins/External/com.drewtrader.paintrelay_2.2.9'
              ps.mkdir(parents=True, exist_ok=True)
              (ps/'manifest.json').write_text('{"id":"com.drewtrader.paintrelay","version":"2.2.9"}')
              watched = [install/'PaintSync.exe',data/'settings.ini',panel/'CSXS/manifest.xml',ps/'manifest.json']
              original = [digest(p) for p in watched]
              photoshop = illustrator = wizard = None
              try:
                  photoshop = editor('Photoshop')
                  illustrator = editor('Illustrator')
                  silent = subprocess.run([str(new),'/S','/UPDATE','/LANG=en'],timeout=45)
                  assert silent.returncode == 16, silent.returncode
                  assert [digest(p) for p in watched] == original
                  wizard = subprocess.Popen([str(new),'/UPDATE','/LANG=en'])
                  both = 'close Photoshop + Illustrator.'
                  hwnd, _, _ = wait_for(wizard, both)
                  click_button(hwnd, 4)
                  time.sleep(.6)
                  wait_for(wizard, both)
                  stopped(photoshop)
                  hwnd, _, _ = wait_for(wizard, both)
                  click_button(hwnd, 4)
                  hwnd, _, _ = wait_for(wizard, 'close Illustrator.')
                  click_button(hwnd, 2)
                  assert wizard.wait(timeout=15) == 16
                  assert [digest(p) for p in watched] == original
                  with winreg.OpenKey(winreg.HKEY_CURRENT_USER,setup_registry) as key:
                      assert winreg.QueryValueEx(key,'InstalledVersion')[0]=='1.0.14'

                  # An explicitly unselected Photoshop must never block Illustrator repair.
                  with winreg.OpenKey(winreg.HKEY_CURRENT_USER,setup_registry,0,winreg.KEY_SET_VALUE) as key:
                      for name,value in [('EditorSelectionsRecorded',1),('Photoshop',0),('Illustrator',1)]:
                          winreg.SetValueEx(key,name,0,winreg.REG_DWORD,value)
                      winreg.SetValueEx(key,'IllustratorVersion',0,winreg.REG_SZ,'1.0.0')
                  photoshop = editor('Photoshop')
                  wizard = subprocess.Popen([str(new),'/UPDATE','/LANG=en'])
                  hwnd, _, _ = wait_for(wizard,'close Illustrator.')
                  stopped(illustrator)
                  click_button(hwnd,4)
                  hwnd, _, _ = wait_for(wizard,'Ready for your next paint')
                  for _, handle, text in controls(wizard):
                      if text in ('Open PaintSync','Read setup instructions') and gui.SendMessageW(handle,0xF0,0,0):
                          gui.SendMessageW(handle,0xF5,0,0)
                  click_button(hwnd,1)
                  assert wizard.wait(timeout=15) == 0
                  expected = install/'Plugins/Illustrator-Link/extension'
                  assert digest(panel/'CSXS/manifest.xml')==digest(expected/'CSXS/manifest.xml')
                  illustrator = editor('Illustrator')
                  subprocess.run([str(new),'/S','/UPDATE'],check=True,timeout=60)
                  (panel/'engine.js').unlink()
                  assert subprocess.run([str(new),'/S','/UPDATE'],timeout=60).returncode==16
                  stopped(illustrator)
                  subprocess.run([str(new),'/S','/UPDATE'],check=True,timeout=60)
                  assert digest(panel/'engine.js')==digest(expected/'engine.js')
                  print('PASS: both editors, retry while open, one remaining, cancel before writes, silent refusal, successful retry, healthy skip, same-version missing-file repair.')
              finally:
                  for proc in (wizard, photoshop, illustrator):
                      stopped(proc)

          subprocess.run(['gh','release','download','v1.0.14','--repo',os.environ['GITHUB_REPOSITORY'],'--pattern','PaintSync-Setup-1.0.14.exe','--dir',str(root)],check=True)
          prior=root/'PaintSync-Setup-1.0.14.exe'
          assert hashlib.sha256(prior.read_bytes()).hexdigest()=='d19a5f9d5c71c8f35c4977dd9ac51a30fa498d8f3699b25136f15d5b623a11c2'
          verify_editor_prompt(prior,setup,root,install,settings.parent)

          subprocess.run(['gh','release','download','v1.0.12','--repo',os.environ['GITHUB_REPOSITORY'],'--pattern','PaintSync-Setup-1.0.12.exe','--dir',str(root)],check=True)
          old_setup=root/'PaintSync-Setup-1.0.12.exe'
          assert hashlib.sha256(old_setup.read_bytes()).hexdigest()=='fb8213fe4bac60dd8e44642c4ddd862cbbacd507448b40f7a3e38e1dc399bd68'
          subprocess.run([str(old_setup),'/S','/ID=123456','/PLUGINS=none'],check=True,timeout=90)
          assert (install/'PaintSync.exe').exists()
          run_setup('/S','/UPDATE','/PLUGINS=none')
          assert not list((install/'Plugins').glob('PaintSync-Desktop-Link-*-Beta.ccx'))
          assert (install/'Plugins/PaintSync-Desktop-Link-1.0.0.ccx').is_file()
          subprocess.run(['gh','release','download','v1.0.13','--repo',os.environ['GITHUB_REPOSITORY'],'--pattern','PaintSync-Setup-1.0.13.exe','--dir',str(root)],check=True)
          previous=root/'PaintSync-Setup-1.0.13.exe'
          assert hashlib.sha256(previous.read_bytes()).hexdigest()=='0ce10a7453ec3bf0951ee7e913854b1360704b23023b3edab1c9a549a1586190'
          subprocess.run([str(previous),'/S','/ID=123456','/PLUGINS=none'],check=True,timeout=90)
          assert (install/'Plugins/PaintSync-Desktop-Link-2.2.9-Beta.ccx').is_file()
          def run_gui_setup():
              gui=ctypes.WinDLL('user32',use_last_error=True)
              gdi=ctypes.WinDLL('gdi32',use_last_error=True)
              cb=ctypes.WINFUNCTYPE(wintypes.BOOL,wintypes.HWND,wintypes.LPARAM)
              gui.GetWindowThreadProcessId.argtypes=[wintypes.HWND,ctypes.POINTER(wintypes.DWORD)]
              gui.GetDlgItem.argtypes=[wintypes.HWND,ctypes.c_int];gui.GetDlgItem.restype=wintypes.HWND
              gui.SendMessageW.argtypes=[wintypes.HWND,wintypes.UINT,ctypes.c_size_t,ctypes.c_ssize_t];gui.SendMessageW.restype=ctypes.c_ssize_t
              gui.GetWindowTextW.argtypes=[wintypes.HWND,wintypes.LPWSTR,ctypes.c_int]
              gui.IsWindowVisible.argtypes=[wintypes.HWND]
              gdi.GetObjectW.argtypes=[wintypes.HANDLE,ctypes.c_int,ctypes.c_void_p]
              process=subprocess.Popen([str(setup),'/LANG=en','/ID=123456','/PLUGINS=none'])
              try:
                  def windows():
                      found=[]
                      @cb
                      def visit(hwnd,param):
                          pid=wintypes.DWORD();gui.GetWindowThreadProcessId(hwnd,ctypes.byref(pid))
                          if pid.value==process.pid and gui.IsWindowVisible(hwnd):found.append(hwnd)
                          return True
                      gui.EnumWindows(visit,0)
                      return found
                  def wait_text(expected):
                      for _ in range(300):
                          assert process.poll() is None,'Setup exited early'
                          matches=[]
                          for hwnd in windows():
                              @cb
                              def child(handle,param):
                                  text=ctypes.create_unicode_buffer(1024);gui.GetWindowTextW(handle,text,1024)
                                  if text.value==expected and gui.IsWindowVisible(handle):matches.append((hwnd,handle))
                                  return True
                              gui.EnumChildWindows(hwnd,child,0)
                          if matches:return matches[0]
                          time.sleep(.1)
                      raise AssertionError('Missing installer screen: '+expected)
                  hwnd,title=wait_text('Welcome to PaintSync')
                  font=gui.SendMessageW(title,0x31,0,0);lf=ctypes.create_string_buffer(92)
                  assert gdi.GetObjectW(font,92,lf)==92 and lf.raw[26]==5,'ClearType heading missing'
                  assert abs(struct.unpack_from('<i',lf.raw)[0])>=24,'Heading too small'
                  def next_page():gui.SendMessageW(gui.GetDlgItem(hwnd,1),0xF5,0,0)
                  next_page();wait_text('1 / Your iRacing ID')
                  next_page();wait_text('2 / Connect your editors')
                  next_page();wait_text('Ready for your next paint')
                  options={}
                  @cb
                  def read_option(handle,param):
                      label=ctypes.create_unicode_buffer(256);gui.GetWindowTextW(handle,label,256)
                      if label.value in ('Open PaintSync','Read setup instructions'):options[label.value]=handle
                      return True
                  gui.EnumChildWindows(hwnd,read_option,0)
                  assert len(options)==2
                  for handle in options.values():
                      initial=gui.SendMessageW(handle,0xF0,0,0)
                      gui.SendMessageW(handle,0xF5,0,0)
                      assert gui.SendMessageW(handle,0xF0,0,0)==1-initial,'Checkbox interaction broken'
                      if gui.SendMessageW(handle,0xF0,0,0):gui.SendMessageW(handle,0xF5,0,0)
                  next_page();assert process.wait(timeout=20)==0
                  print('PASS: real installer welcome, ClearType font, ID, editors, install, finish, and checkbox interaction.')
              finally:
                  if process.poll() is None:process.kill()
          run_gui_setup()
          installed_files={'PaintSync.exe': '72fd0ae8788afec6fe2a32f4048883670845e19a0de9ebe10fc8f17d21830e02', 'Plugins/PaintSync-Desktop-Link-1.0.0.ccx': '8cedd10823998d57918fec73842a66d4029a7445012f32a7a79139619fdc3c45', 'Plugins/Illustrator-Link/extension/engine.js': '04591e76959a254bb73d57b670c00055e38fc5b6485eed3c44d95c5b34ea8c57', 'Plugins/GIMP-Link/paintsync-link/engine.py': '9e3c6e9892cc41cd74effa79a451d20b1d5070ed89d1eac835b42aa014821b24', 'Plugins/Illustrator-Link/extension/entitlement.js': 'b00ab5604fc93e69fb20f9d845bf463c759b4cd276c04c4cd416373081874395', 'Plugins/GIMP-Link/paintsync-link/entitlement.py': 'a96f4c95dc1d5b8cd5351896feaa7ad6465a7a0c67b6d62a9a20550bc131704f', 'Plugins/SavedImage-Link/PaintSyncImageLink.exe': '4e61049be84d99621d2a58051b58ed3deb53a095dec587912e8030a8e2745655', 'Plugins/Illustrator-Link/extension/CSXS/manifest.xml': '6504acf7e0dfaeba958355f41e0efda2b553935f91cdc7eed6e3c1766eb1977f', 'Plugins/Illustrator-Link/Install.ps1': '5fc7912dbba450e2bd7e5f9440d2ecba12ab3657b193973881238a4ddbf31ca1', 'Plugins/Install-Photoshop-Link.ps1': '6529feb4c8df6bf0f923a2e9d73f1bfad25bdb1764c1a9dbd1ffb598f21f4492', 'Plugins/AdobeLinkCheck.ps1': 'c8612ae764d05b6c6306d5f611ec9be2fa7185d2b726b7380a68ba244d69abec', 'Plugins/AdobeLinkFiles.json': '712b6dd4763514d2cd4bfd4b425ce96784bcc9153c21763a01b81db885541ec7'}
          for name,digest in installed_files.items():
              assert hashlib.sha256((install/name).read_bytes()).hexdigest()==digest,name
          assert (install/'Read-Me.txt').read_bytes()==(root/'Read-Me.txt').read_bytes()
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          import base64
          image=(install/'PaintSync.exe').read_bytes()
          Ed25519PublicKey.from_public_bytes(base64.b64decode('VMLVwz8SJ4lwAMi9clASezBmvJEGIqqjgjkziTF5Lwk=')).verify(image[-64:],b'PaintSync/desktop-image/v1\0'+hashlib.sha256(image[:-64]).digest())
          guide=(install/'Read-Me.txt').read_text(encoding='utf-8')
          assert 'COMPLETE USER GUIDE' in guide and '20. SUPPORT AND QUICK REFERENCE' in guide
          start_menu=pathlib.Path(os.environ['APPDATA'])/'Microsoft/Windows/Start Menu/Programs/PaintSync'
          assert (start_menu/'User guide.lnk').is_file() and (start_menu/'Image Link.lnk').is_file()
          helper=install/'Plugins/SavedImage-Link/PaintSyncImageLink.exe'
          assert helper.is_file()
          selftest=root/'image-link-check';selftest.mkdir()
          subprocess.run([str(helper),'--self-test',str(selftest)],check=True,timeout=45)
          result=json.loads((selftest/'image-link-self-test.json').read_text())
          assert result=={'result':'PASS','rgba':True,'rle':True,'tk_runtime':True}
          for filename in ['paintsync-link.py','engine.py','host.py']:
              assert (install/'Plugins/GIMP-Link/paintsync-link'/filename).is_file()
          for filename in ['Python-LICENSE.txt','pillow-LICENSE','pyinstaller-COPYING.txt']:
              assert (install/'Plugins/SavedImage-Link/Third-Party'/filename).is_file()
          kernel=ctypes.WinDLL('kernel32',use_last_error=True)
          kernel.CreateMutexW.argtypes=[ctypes.c_void_p,wintypes.BOOL,wintypes.LPCWSTR]
          kernel.CreateMutexW.restype=wintypes.HANDLE
          kernel.CloseHandle.argtypes=[wintypes.HANDLE]
          mutex=kernel.CreateMutexW(None,False,r'Local\PaintSync_Image_Link')
          assert mutex
          preserved=settings.read_bytes()
          installed_hash=hashlib.sha256((install/'PaintSync.exe').read_bytes()).hexdigest()
          try:
              run_setup('/S','/UPDATE','/PLUGINS=none',expected=10)
              assert settings.read_bytes()==preserved
              assert hashlib.sha256((install/'PaintSync.exe').read_bytes()).hexdigest()==installed_hash
          finally:
              kernel.CloseHandle(mutex)
          print('PASS: complete installed guide, Start-menu shortcuts, packaged Image Link runtime/RLE/alpha, GIMP payload, license notices, and busy-Image-Link update guard.')
          assert (install/'PaintSync.exe').exists() and (install/'WinSparkle.dll').exists()
          for value in ['CustomerID=123456','Seconds=0.5','Theme=2','Vehicle=trucks fordf150']:
              assert value in settings.read_text(encoding='utf-16'),value
          exe=(install/'PaintSync.exe').read_bytes()
          fixed=struct.unpack_from('<13I',exe,exe.index(struct.pack('<I',0xfeef04bd)))
          assert fixed[2:6]==(65536,983040,65536,983040) and fixed[7]==0
          assert '1.0.15'.encode('utf-16le') in exe
          u=ctypes.WinDLL('user32',use_last_error=True)
          u.GetDlgItem.argtypes=[wintypes.HWND,ctypes.c_int];u.GetDlgItem.restype=wintypes.HWND
          u.SendMessageW.argtypes=[wintypes.HWND,wintypes.UINT,ctypes.c_size_t,ctypes.c_ssize_t];u.SendMessageW.restype=ctypes.c_ssize_t
          u.IsWindowEnabled.argtypes=[wintypes.HWND]
          u.GetWindowThreadProcessId.argtypes=[wintypes.HWND,ctypes.POINTER(wintypes.DWORD)]
          callback=ctypes.WINFUNCTYPE(wintypes.BOOL,wintypes.HWND,wintypes.LPARAM)
          def launch_check(close_panel):
              process=subprocess.Popen([str(install/'PaintSync.exe')])
              try:
                  found=[]
                  @callback
                  def visit(hwnd,param):
                      pid=wintypes.DWORD()
                      u.GetWindowThreadProcessId(hwnd,ctypes.byref(pid))
                      if pid.value==process.pid and u.GetDlgItem(hwnd,600): found.append(hwnd)
                      return True
                  for _ in range(80):
                      assert process.poll() is None,'App exited before activation'
                      u.EnumWindows(visit,0)
                      if found:break
                      time.sleep(.25)
                  assert found,'Activation page not found'
                  hwnd=found[0];panel=u.GetDlgItem(hwnd,600)
                  if close_panel:
                      u.SendMessageW(panel,0x111,2,0)
                      save_rect=wintypes.RECT();start_rect=wintypes.RECT()
                      u.GetWindowRect.argtypes=[wintypes.HWND,ctypes.POINTER(wintypes.RECT)]
                      assert u.GetWindowRect(u.GetDlgItem(hwnd,12),ctypes.byref(save_rect))
                      assert u.GetWindowRect(u.GetDlgItem(hwnd,10),ctypes.byref(start_rect))
                      assert save_rect.right<start_rect.left and save_rect.top==start_rect.top
                      texts=[]
                      u.GetWindowTextW.argtypes=[wintypes.HWND,wintypes.LPWSTR,ctypes.c_int]
                      @callback
                      def read_child(child,param):
                          text=ctypes.create_unicode_buffer(512)
                          u.GetWindowTextW(child,text,512)
                          if text.value:texts.append(text.value)
                          return True
                      u.EnumChildWindows(hwnd,read_child,0)
                      assert 'Save Settings before hitting Start autosave.' in texts
                      assert '1.0.15' in texts and 'Ready to Race?' in texts
                      output_windows=[]
                      u.GetClassNameW.argtypes=[wintypes.HWND,wintypes.LPWSTR,ctypes.c_int]
                      @callback
                      def find_output(handle,param):
                          pid=wintypes.DWORD();u.GetWindowThreadProcessId(handle,ctypes.byref(pid))
                          name=ctypes.create_unicode_buffer(128);u.GetClassNameW(handle,name,128)
                          if pid.value==process.pid and name.value=='PaintSyncOutput':output_windows.append(handle)
                          return True
                      u.EnumWindows(find_output,0)
                      assert len(output_windows)==1
                      popup=output_windows[0]
                      for parent,control in [(hwnd,10),(popup,11),(popup,31),(popup,15)]:
                          handle=u.GetDlgItem(parent,control)
                          assert handle and not u.IsWindowEnabled(handle),'Unlicensed export control enabled'
                      u.IsWindowVisible.argtypes=[wintypes.HWND]
                      u.SendMessageW(hwnd,0x111,37,u.GetDlgItem(hwnd,37))
                      assert u.IsWindowVisible(popup)
                      u.GetWindowLongW.argtypes=[wintypes.HWND,ctypes.c_int]
                      for window in [hwnd,popup]:
                          assert u.GetWindowLongW(window,-20)&0x02000000,'Expected buffered control painting'

                      u.SendMessageW(popup,0x10,0,0)
                      assert not u.IsWindowVisible(popup)
                      u.SendMessageW(hwnd,0x111,22,u.GetDlgItem(hwnd,22))
                      u.SendMessageW(hwnd,0x111,39,u.GetDlgItem(hwnd,39))
                      for control in [101,102,2,3,16,17]:assert u.IsWindowVisible(u.GetDlgItem(hwnd,control))
                      u.SendMessageW(hwnd,0x111,20,u.GetDlgItem(hwnd,20))
                  u.SendMessageW(hwnd,0x10,0,0)
                  assert process.wait(timeout=10)==0
              finally:
                  if process.poll() is None:process.kill()
          launch_check(True)
          license_file=data/'license.key';license_file.write_text('K0ODIXNG',encoding='ascii')
          launch_check(False)
          license_before=license_file.read_bytes()
          import shutil, zipfile, xml.etree.ElementTree as ET
          assert not list((install/'Plugins').glob('PaintSync-Desktop-Link-*-Beta.ccx'))
          ccx=install/'Plugins/PaintSync-Desktop-Link-1.0.0.ccx'
          shutil.copyfile(install/'Plugins/Install-Photoshop-Link.ps1',root/'Install-Photoshop-Link.ps1')
          shutil.copyfile(ccx,root/ccx.name)
          with zipfile.ZipFile(ccx) as package:
              ps=json.loads(package.read('manifest.json'))
              assert ps['id']=='com.drewtrader.paintsync.photoshop' and ps['version']=='1.0.0' and ps['name']=='PaintSync Desktop Link'
              assert ps['host']['app']=='PS' and ps['host']['minVersion']=='25.10.0' and 'maxVersion' not in ps['host']
              assert all(n in package.namelist() for n in (ps['main'],'link.js','export.js','entitlement.js'))
          # Simulate a selected Illustrator installation with a stale discovery-folder copy.
          cep=pathlib.Path(os.environ['APPDATA'])/'Adobe/CEP/extensions/com.drewtrader.paintsync.illustrator'
          for folder in (cep,cep.with_suffix('.illustrator.previous')):
              folder.mkdir(parents=True,exist_ok=True)
              (folder/'old-panel.txt').write_text('1.0.12')
          reg=r'Software\PaintSync\Setup'
          with winreg.OpenKey(winreg.HKEY_CURRENT_USER,reg,0,winreg.KEY_SET_VALUE) as key:
              winreg.SetValueEx(key,'Illustrator',0,winreg.REG_DWORD,1)
              winreg.SetValueEx(key,'IllustratorVersion',0,winreg.REG_SZ,'0.2.7')
          with winreg.CreateKey(winreg.HKEY_CURRENT_USER,r'Software\Adobe\CSXS.12') as key:
              winreg.SetValueEx(key,'KeepOtherPanel',0,winreg.REG_SZ,'preserve')
          run_setup('/S','/UPDATE')
          assert not cep.with_suffix('.illustrator.previous').exists()
          assert (cep/'CSXS/manifest.xml').read_bytes()==(install/'Plugins/Illustrator-Link/extension/CSXS/manifest.xml').read_bytes()
          ai=ET.parse(cep/'CSXS/manifest.xml').getroot()
          assert ai.get('ExtensionBundleVersion')=='1.0.0' and ai.findtext('.//Menu')=='PaintSync Desktop Link'
          assert ai.find('.//Host').get('Version')=='[25.3,31.99]'
          with winreg.OpenKey(winreg.HKEY_CURRENT_USER,r'Software\Adobe\CSXS.12') as key:
              assert winreg.QueryValueEx(key,'PlayerDebugMode')[0]=='1'
              assert winreg.QueryValueEx(key,'KeepOtherPanel')[0]=='preserve'
          with winreg.OpenKey(winreg.HKEY_CURRENT_USER,reg) as key:
              assert winreg.QueryValueEx(key,'IllustratorVersion')[0]=='1.0.0'
          print('PASS CCX registration metadata for Photoshop 28 and selected Illustrator 31 panel upgrade, duplicate cleanup, other CEP preference preservation.')
          assert license_file.read_bytes()==license_before
          for value in ['CustomerID=123456','Seconds=0.5','Theme=2','Vehicle=trucks fordf150']:
              assert value in settings.read_text(encoding='utf-16')
          with winreg.OpenKey(winreg.HKEY_CURRENT_USER,r'Software\Microsoft\Windows\CurrentVersion\Uninstall\PaintSync') as key:
              assert winreg.QueryValueEx(key,'DisplayVersion')[0]=='1.0.15'
          subprocess.run([str(install/'Uninstall.exe'),'/S'],check=True,timeout=60)
          removed=[install/'PaintSync.exe',install/'Read-Me.txt',start_menu/'User guide.lnk',install/'Plugins/SavedImage-Link/PaintSyncImageLink.exe']
          for _ in range(240):
              if all(not path.exists() for path in removed):break
              time.sleep(.25)
          assert all(not path.exists() for path in removed),'Uninstall did not finish removing its app, guide, shortcuts and Image Link'
          assert not (install/'PaintSync.exe').exists()
          assert not (install/'Read-Me.txt').exists() and not (start_menu/'User guide.lnk').exists()
          assert settings.exists() and license_file.read_bytes()==license_before and sentinel.read_bytes()==b'KEEP PAINT'
          print('PASS: upgrade from 1.0.12, stable metadata, compact Paint heading, Settings/Folders, export pop-out, Save/Start ordering and reminder, ID validation, activation page, locked exports, invalid saved license, normal close, upgrade persistence and uninstall preservation.')


      - name: Verify the stable Photoshop migration and recovery paths
        shell: pwsh
        run: |
          $qaRoot=Join-Path $env:RUNNER_TEMP 'paintsync-1015'
          $InstallerScript=Join-Path $qaRoot 'Install-Photoshop-Link.ps1'
          $Package=Join-Path $qaRoot 'PaintSync-Desktop-Link-1.0.0.ccx'
          $ErrorActionPreference = 'Stop'
          . $InstallerScript -PackageVersion '1.0.0'
          $root=Join-Path ([IO.Path]::GetTempPath()) ('PaintSync-Adobe-QA-'+[guid]::NewGuid())
          $external=Join-Path $root 'External'
          $testLegacyFolder=Join-Path $external 'com.drewtrader.paintrelay_2.2.9'
          $stable=Join-Path $external 'com.drewtrader.paintsync.photoshop_1.0.0'
          $agent=Join-Path $root 'AdobeInstallerTest.ps1'
          try {
              New-Item -ItemType Directory -Path $testLegacyFolder -Force | Out-Null
              '{"id":"com.drewtrader.paintrelay","name":"PaintSync for iRacing","version":"2.2.9"}' | Set-Content -LiteralPath (Join-Path $testLegacyFolder 'manifest.json')
              $fake=@'
          param($Operation,$Product)
          if ($Operation -eq '/install') {
              if ($Product -ne $Package) {throw 'Unexpected package'}
              if ($simulatedCode -ne 0) {exit $simulatedCode}
              New-Item -ItemType Directory -Path $stable -Force | Out-Null
              '{"id":"com.drewtrader.paintsync.photoshop","version":"1.0.0"}' | Set-Content -LiteralPath (Join-Path $stable 'manifest.json')
              exit 0
          }
          if ($Operation -ne '/remove' -or $Product -cne 'PaintSync for iRacing' -or !(Test-Path $stable)) {throw 'Unsafe removal order or name'}
          if ($keepLegacy) {exit 1}
          Rename-Item -LiteralPath $testLegacyFolder -NewName 'retired-test-package'
          exit 0
          '@
              $fake | Set-Content -LiteralPath $agent
              $simulatedCode=-456
              $keepLegacy=$false
              if ((Install-DesktopLink $agent $Package $external) -ne 2 -or !(Test-Path $testLegacyFolder)) {throw 'Lost the old panel after a failed install'}
              $simulatedCode=0
              $keepLegacy=$true
              if ((Install-DesktopLink $agent $Package $external) -ne 3 -or !(Test-Path $stable)) {throw 'Failed cleanup was not reported'}
              $keepLegacy=$false
              $simulatedCode=-412
              if ((Install-DesktopLink $agent $Package $external) -ne 0 -or (Test-Path $testLegacyFolder) -or !(Test-Path $stable)) {throw 'Could not migrate installed 2.x to stable 1.0.0'}
              $simulatedCode=0
              if ((Install-DesktopLink $agent $Package $external) -ne 0) {throw 'Stable reinstall failed'}
              Write-Output 'PASS Photoshop migration, failed registration, pending cleanup, retry and stable reinstall.'
          } finally {
              $resolved=[IO.Path]::GetFullPath($root)
              $expected=[IO.Path]::GetFullPath([IO.Path]::GetTempPath()).TrimEnd('\')+'\PaintSync-Adobe-QA-'
              if ($resolved.StartsWith($expected,[StringComparison]::OrdinalIgnoreCase)) {Remove-Item -LiteralPath $resolved -Recurse -Force}
          }
