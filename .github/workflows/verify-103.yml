          app.write_bytes(fake)
          try:
              setup(bundle,'/PLUGINS=none',expected=18)
              assert app.read_bytes()==fake and target.read_bytes()==original
          finally:app.write_bytes(app_bytes)
          setup(bundle,'/PLUGINS=none')
          assert not marker.exists();unchanged()
          print('PASS incompatible next-generation app rejected; valid app restored and repaired.')
          
          # Plugin checks have separate preferences and fixed public trust configuration.
          updater=(install/'PaintSyncPluginUpdater.exe').read_bytes()
          assert b'releases/download/plugins-v1-channel/appcast.xml' in updater
          assert b'Software\\PaintSync\\PluginUpdates' in updater
          assert b'VMLVwz8SJ4lwAMi9clASezBmvJEGIqqjgjkziTF5Lwk=' in updater
          print('PASS plugin updater uses its own channel/preferences and the existing signing key.')
          
          setup(install/'Uninstall.exe')
          for _ in range(100):
              if all(not (install/name).exists() for name in ['PaintSync.exe','PaintSyncPluginUpdater.exe','PluginBackups']):break
              time.sleep(.2)
          assert not (install/'PaintSyncPluginUpdater.exe').exists()
          assert not (install/'PluginBackups').exists()
          assert all(digest(p)==protected[p] for p in [settings,license,sentinel])
          print('PASS uninstall removes plugin updater/backups while retaining activation/settings/artwork.')

      - name: Verify the stable Photoshop migration and recovery paths
        shell: pwsh
        run: |
          $qaRoot=Join-Path $env:RUNNER_TEMP 'paintsync-1024'
          $InstallerScript=Join-Path $qaRoot 'Install-Photoshop-Link.ps1'
          $Package=Join-Path $qaRoot 'PaintSync-Desktop-Link-1.0.2.ccx'
          $ErrorActionPreference = 'Stop'
          . $InstallerScript -PackageVersion '1.0.2'
          $root=Join-Path ([IO.Path]::GetTempPath()) ('PaintSync-Adobe-QA-'+[guid]::NewGuid())
          $external=Join-Path $root 'External'
          $testLegacyFolder=Join-Path $external 'com.drewtrader.paintrelay_2.2.9'
          $stable=Join-Path $external 'com.drewtrader.paintsync.photoshop_1.0.2'
          $agent=Join-Path $root 'AdobeInstallerTest.ps1'
          try {
              New-Item -ItemType Directory -Path $testLegacyFolder -Force | Out-Null
              '{"id":"com.drewtrader.paintrelay","name":"PaintSync for iRacing","version":"2.2.9"}' | Set-Content -LiteralPath (Join-Path $testLegacyFolder 'manifest.json')
              $fake=@'
          param($Operation,$Product)
          if ($Operation -eq '/install') {
              if ($Product -ne $Package) {throw 'Unexpected package'}
              if ($simulatedCode -ne 0) {exit $simulatedCode}
              New-Item -ItemType Directory -Path $stable -Force | Out-Null
              '{"id":"com.drewtrader.paintsync.photoshop","version":"1.0.2"}' | Set-Content -LiteralPath (Join-Path $stable 'manifest.json')
              exit 0
          }
          if ($Operation -ne '/remove' -or $Product -cne 'PaintSync for iRacing' -or !(Test-Path $stable)) {throw 'Unsafe removal order or name'}
          if ($keepLegacy) {exit 1}
          Rename-Item -LiteralPath $testLegacyFolder -NewName 'retired-test-package'
          exit 0
          '@
              $fake | Set-Content -LiteralPath $agent
              $simulatedCode=-456
              $keepLegacy=$false
              if ((Install-DesktopLink $agent $Package $external) -ne 2 -or !(Test-Path $testLegacyFolder)) {throw 'Lost the old panel after a failed install'}
              $simulatedCode=0
              $keepLegacy=$true
              if ((Install-DesktopLink $agent $Package $external) -ne 3 -or !(Test-Path $stable)) {throw 'Failed cleanup was not reported'}
              $keepLegacy=$false
              $simulatedCode=-412
              if ((Install-DesktopLink $agent $Package $external) -ne 0 -or (Test-Path $testLegacyFolder) -or !(Test-Path $stable)) {throw 'Could not migrate installed 2.x to stable 1.0.1'}
              $simulatedCode=0
              if ((Install-DesktopLink $agent $Package $external) -ne 0) {throw 'Stable reinstall failed'}
              Write-Output 'PASS Photoshop migration, failed registration, pending cleanup, retry and stable reinstall.'
          } finally {
              $resolved=[IO.Path]::GetFullPath($root)
              $expected=[IO.Path]::GetFullPath([IO.Path]::GetTempPath()).TrimEnd('\')+'\PaintSync-Adobe-QA-'
              if ($resolved.StartsWith($expected,[StringComparison]::OrdinalIgnoreCase)) {Remove-Item -LiteralPath $resolved -Recurse -Force}
          }


  publish-verified-update:
    needs: verify-installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install public signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Publish the verified independent plugin channel
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,subprocess,time,urllib.request,xml.etree.ElementTree as ET
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='arcdtrade/PaintSync-Releases'
          expected={'PaintSync-Plugins-1.0.0.exe': '46298555880a40e552ae59e1daca2dbc4f1ae56db3eb5170028d162871d3be1f', 'appcast.xml': 'c23fe47efad7cbfcd42aa17cd2c97fa9102d75c8e78e9a3e8930efde3288fb8d', 'Read-Me.txt': 'c0b674b3613ad1ac6920b56a41dee3018fbfedcbf44ba69e1f0634dd2f57158a', 'SHA256SUMS.txt': '91f55caf36560ac9c7a855d4b294ff267f059b14149e35a063caabaa3b653260'}
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'plugins-publish';root.mkdir()
          def gh(*args):return subprocess.check_output(['gh',*map(str,args)],text=True).strip()
          matches=[r for r in json.loads(gh('api',f'repos/{repo}/releases?per_page=100')) if r['name']=='PaintSync Plugins 1.0.0'];assert len(matches)==1
          release=matches[0]
          assert not release['prerelease']
          assets={a['name']:a for a in release['assets']}
          for name,digest in expected.items():
           assert assets[name]['digest']=='sha256:'+digest
           with (root/name).open('wb') as output:
            subprocess.run(['gh','api',f"repos/{repo}/releases/assets/{assets[name]['id']}",'-H','Accept: application/octet-stream'],stdout=output,check=True)
           assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          ns='{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          item=ET.fromstring((root/'appcast.xml').read_bytes()).find('channel/item');enc=item.find('enclosure')
          raw=(root/'PaintSync-Plugins-1.0.0.exe').read_bytes()
          assert item.findtext(ns+'version')=='1.0.0' and int(enc.get('length'))==len(raw)
          assert enc.get('url')==f'https://github.com/{repo}/releases/download/plugins-1.0.0/PaintSync-Plugins-1.0.0.exe'
          Ed25519PublicKey.from_public_bytes(base64.b64decode('VMLVwz8SJ4lwAMi9clASezBmvJEGIqqjgjkziTF5Lwk=')).verify(base64.b64decode(enc.get(ns+'edSignature')),raw)
          gh('api','--method','PATCH',f"repos/{repo}/releases/{release['id']}",'-f','tag_name=plugins-1.0.0','-F','draft=false','-F','prerelease=false','-f','make_latest=false')
          def public(url):
           with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'PaintSync-Release-Verification'}),timeout=60) as response:return response.read(100*1024*1024)
          assert hashlib.sha256(public(enc.get('url'))).hexdigest()==expected['PaintSync-Plugins-1.0.0.exe']
          check=subprocess.run(['gh','api',f'repos/{repo}/releases/tags/plugins-v1-channel'],capture_output=True,text=True)
          if check.returncode:
           assert '404' in check.stderr,check.stderr
           gh('release','create','plugins-v1-channel',root/'appcast.xml','--repo',repo,'--title','PaintSync Plugin Update Channel','--notes','Signed independent editor connection updates. Requires PaintSync 1.0.24 or later. Windows installer and recovery checks passed.','--prerelease','--latest=false')
          else:
           channel=json.loads(check.stdout)
           assert next(a for a in channel['assets'] if a['name']=='appcast.xml')['digest']=='sha256:'+expected['appcast.xml'],'Do not replace a different active plugin feed'
          for attempt in range(24):
           try:
            if public(f'https://github.com/{repo}/releases/download/plugins-v1-channel/appcast.xml')==(root/'appcast.xml').read_bytes():break
           except Exception:
            if attempt==23:raise
           time.sleep(5)
          else:raise AssertionError('Public plugin channel bytes differ')
          print('PASS independent plugin release and public signed channel after Windows verification.')
      - name: Promote the verified installer and switch the signed update feed
        shell: python
        run: |
          """GitHub Actions only: run after the Windows verification job succeeds.
          The installer and appcast were signed locally. No private signing key is used
          or uploaded here. GITHUB_TOKEN is scoped to this release publication job.
          """
          from pathlib import Path
          import base64,hashlib,json,os,subprocess,time,urllib.request,xml.etree.ElementTree as ET
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='arcdtrade/PaintSync-Releases'
          version='1.0.24';tag='v'+version
          expected_installer='9f88eb90d3507549e89916d5d25cde2d7ba87dc882241940b6e26c034c525d37'
          expected_feed='7993de3950eec40fae1f839ad8898017ce324eee6817f113f7e0fc1bc51f7ecb'
          old_feed_digest='ab8fea06cf2aa2a2d1423ea23ce75a9f07d8e15b7a5b0a65daab40cabe62b6fd'
          root=Path(os.environ['RUNNER_TEMP'])/'paintsync-publish-1024';root.mkdir()
          def gh(*args):return subprocess.check_output(['gh',*map(str,args)],text=True).strip()
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          matches=[r for r in json.loads(gh('api',f'repos/{repo}/releases?per_page=100')) if r['name']=='PaintSync '+version];assert len(matches)==1
          release=matches[0]
          assert release['tag_name']==tag or (release['draft'] and release['tag_name'].startswith('untagged-'))
          assert not release['prerelease'], 'Expected the Windows-verified promoted release'
          assets={a['name']:a for a in release['assets']}
          installer=f'PaintSync-Setup-{version}.exe'
          for name,expected in [(installer,expected_installer),('appcast.xml',expected_feed)]:
           asset=assets[name];assert asset['digest']=='sha256:'+expected
           with (root/name).open('wb') as output:
            subprocess.run(['gh','api',f"repos/{repo}/releases/assets/{asset['id']}",'-H','Accept: application/octet-stream'],stdout=output,check=True)
           assert digest(root/name)==expected
          ns='{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          item=ET.fromstring((root/'appcast.xml').read_bytes()).find('channel/item');enclosure=item.find('enclosure')
          assert item.findtext(ns+'version')==version
          assert enclosure.get('url')==f'https://github.com/{repo}/releases/download/{tag}/{installer}'
          assert enclosure.get(ns+'installerArguments')=='/UPDATE'
          assert int(enclosure.get('length'))==(root/installer).stat().st_size
          Ed25519PublicKey.from_public_bytes(base64.b64decode('VMLVwz8SJ4lwAMi9clASezBmvJEGIqqjgjkziTF5Lwk=')).verify(base64.b64decode(enclosure.get(ns+'edSignature')),(root/installer).read_bytes())
          def public(url):
           request=urllib.request.Request(url,headers={'User-Agent':'PaintSync-Release-Verification'})
           with urllib.request.urlopen(request,timeout=60) as response:return response.read(100*1024*1024)
          # Publication is gated by the successful Windows job and exact signed bytes.
          if release['draft']:
           gh('api','--method','PATCH',f"repos/{repo}/releases/{release['id']}",'-f','tag_name='+tag,'-F','draft=false','-F','prerelease=false','-f','make_latest=true')
          assert hashlib.sha256(public(enclosure.get('url'))).hexdigest()==expected_installer
          latest=json.loads(gh('api',f'repos/{repo}/releases/latest'))
          assert latest['tag_name']==tag and not latest['prerelease']
          channel=json.loads(gh('api',f'repos/{repo}/releases/tags/beta-channel'))
          active=next(a for a in channel['assets'] if a['name']=='appcast.xml')
          if active['digest']!='sha256:'+expected_feed:
           assert active['digest']=='sha256:'+old_feed_digest, 'Another release changed the channel; stop safely'
           staged_name='appcast-'+version+'.xml'
           staged=next((a for a in channel['assets'] if a['name']==staged_name),None)
           if staged is None:
            (root/staged_name).write_bytes((root/'appcast.xml').read_bytes())
            gh('release','upload','beta-channel',root/staged_name,'--repo',repo)
            channel=json.loads(gh('api',f'repos/{repo}/releases/tags/beta-channel'))
            staged=next(a for a in channel['assets'] if a['name']==staged_name)
           assert staged['digest']=='sha256:'+expected_feed
           assert not any(a['name']=='appcast-1.0.23.xml' for a in channel['assets']), 'Prior archive already exists'
           # Keep the previous signed feed as a rollback archive; never delete assets.
           gh('api','--method','PATCH',f"repos/{repo}/releases/assets/{active['id']}",'-f','name=appcast-1.0.23.xml')
           try:
            gh('api','--method','PATCH',f"repos/{repo}/releases/assets/{staged['id']}",'-f','name=appcast.xml')
           except Exception:
            current=json.loads(gh('api',f'repos/{repo}/releases/tags/beta-channel'))
            live=next((a for a in current['assets'] if a['name']=='appcast.xml'),None)
            if live is None:
             gh('api','--method','PATCH',f"repos/{repo}/releases/assets/{active['id']}",'-f','name=appcast.xml')
             raise
            if live['digest']!='sha256:'+expected_feed:raise
          channel=json.loads(gh('api',f'repos/{repo}/releases/tags/beta-channel'))
          assert next(a for a in channel['assets'] if a['name']=='appcast.xml')['digest']=='sha256:'+expected_feed
          archived=next(a for a in channel['assets'] if a['name']=='appcast-1.0.23.xml')
          assert archived['digest']=='sha256:'+old_feed_digest
          # A replaced GitHub release asset may retain its old redirect briefly.
          # Verify the exact canonical URL; do not bypass the updater's real URL.
          for attempt in range(60):
           try:
            live=public(f'https://github.com/{repo}/releases/download/beta-channel/appcast.xml')
            if live==(root/'appcast.xml').read_bytes():break
           except Exception:
            if attempt==59:raise
           time.sleep(5)
          else:raise AssertionError('Canonical public updater feed still differs')
          channel_notes=root/'channel-notes.txt'
          channel_notes.write_text('The active Windows feed offers [PaintSync '+version+'](https://github.com/'+repo+'/releases/tag/'+tag+').\n\nAdds independent signed plugin updates, connection version details, reinstall/repair, editor-close prompts and compatibility/downgrade protection. Existing licenses, settings and editor links are preserved.\n\nIn PaintSync, open Settings > General > Check for updates. Save artwork and stop autosave before installing.\n\n[Windows installation, upgrade and panel startup checks passed](https://github.com/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+').\n',encoding='utf-8')
          gh('release','edit','beta-channel','--repo',repo,'--notes-file',channel_notes)
          print('PASS: Windows-verified stable '+version+', exact public installer hash, Ed25519 signature, previous-feed archive and active updater bytes.')
          print('https://github.com/'+repo+'/releases/tag/'+tag)




