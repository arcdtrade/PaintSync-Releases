name: Verify and publish PaintSync Plugins 1.1.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-103.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paintsync-plugin-api-2-publication
  cancel-in-progress: false
jobs:
  stage-release-files:
    if: github.repository == 'arcdtrade/PaintSync-Releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Stage exact draft assets and published upgrade fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          expected = {'PaintSync-Plugins-1.1.3.exe': '217c42518651c756d04819e0ff02f18c0c73ab6ac4e61e314037598154be2215', 'appcast.xml': 'fc3de834a8e54ba11ad65b3f1823b0cb9204550fd4f6af83792251a2d3394384', 'Read-Me.txt': '68d3fb900635e32f46063b9ee2e9ea2aec6320060290742033a3abee1c36100a', 'SHA256SUMS.txt': '9a3490ec00d4120fc9940fdc7770b3024ab43d235ffb90bfc86b92d3ed6a3cbc'}
          previous_feed = '616921f1a7e85492ad540c8cd77a540334c0eb0022ab52db18df1cc0fa2b0fc0'
          release_id = 453907402
          import hashlib, json, os, subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']; assert repo == 'arcdtrade/PaintSync-Releases'
          tag = 'plugins-1.1.3'
          title = 'PaintSync Plugins 1.1.3'
          channel_tag = 'plugins-v2-channel'
          installer = 'PaintSync-Plugins-1.1.3.exe'
          feed = 'appcast.xml'

          def gh(*args):
              return subprocess.check_output(['gh', *map(str, args)], text=True, timeout=120).strip()

          def release_for_tag(wanted):
              release = json.loads(gh('api', f'repos/{repo}/releases/tags/{wanted}'))
              assert release['tag_name'] == wanted and not release['draft']
              return release

          def assets_by_name(release):
              assets = {asset['name']: asset for asset in release['assets']}
              assert len(assets) == len(release['assets']), 'Duplicate release asset names'
              return assets

          def candidate_release():
              pages = json.loads(gh('api', '--paginate', '--slurp', f'repos/{repo}/releases?per_page=100'))
              matches = [r for page in pages for r in page if r['name'] == title or r['tag_name'] == tag]
              assert len(matches) == 1, 'Expected exactly one release or draft for plugin version 1.1.3'
              release = matches[0]
              assert release['name'] == title and release['id'] == release_id
              assert release['tag_name'] == tag or (release['draft'] and release['tag_name'].startswith('untagged-'))
              assets = assets_by_name(release)
              assert set(assets) == set(expected), 'The release asset set differs from the approved version'
              for name, digest in expected.items():
                  assert assets[name]['state'] == 'uploaded' and assets[name]['digest'] == 'sha256:' + digest, name
              return release, assets

          def download_asset(asset, path, digest):
              assert asset['state'] == 'uploaded' and asset['digest'] == 'sha256:' + digest, path.name
              with path.open('wb') as handle:
                  subprocess.run(
                      ['gh', 'api', f"repos/{repo}/releases/assets/{asset['id']}", '-H', 'Accept: application/octet-stream'],
                      stdout=handle, check=True, timeout=120,
                  )
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, path.name

          def channel_assets():
              return assets_by_name(release_for_tag(channel_tag))

          def has_hash(asset, digest):
              return asset is not None and asset['state'] == 'uploaded' and asset['digest'] == 'sha256:' + digest
          previous_installers = {'plugins-1.1.2': ('PaintSync-Plugins-1.1.2.exe', 'c719b2dbce7253213be0b0f67de6d88ada3022a7a164ee768d0defe1f338318f'), 'v1.0.24': ('PaintSync-Setup-1.0.24.exe', '9f88eb90d3507549e89916d5d25cde2d7ba87dc882241940b6e26c034c525d37'), 'v1.0.27': ('PaintSync-Setup-1.0.27.exe', 'e318638f89a33cad7c30a30e1d41cfe66dca41cf5c8a13ecec5ac5aff979c4b3')}
          root = Path(os.environ['RUNNER_TEMP']) / 'paintsync-plugins-113'
          folder = root / 'candidate'; folder.mkdir(parents=True)
          release, assets = candidate_release()
          channel = channel_assets()
          active = channel.get(feed)
          if not has_hash(active, previous_feed) and not has_hash(active, expected[feed]):
              # Recover only the recognizable interrupted switch, in the gated publisher.
              assert active is None
              assert has_hash(channel.get('appcast-1.1.2.xml'), previous_feed)
              assert has_hash(channel.get('appcast-1.1.3.xml'), expected[feed])
          for name, digest in expected.items():
              download_asset(assets[name], folder / name, digest)
          for version, (name, digest) in previous_installers.items():
              download_asset(assets_by_name(release_for_tag(version))[name], root / name, digest)
          print('PASS candidate assets and exact published app and plugin installers staged without running any installer.')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-plugin-release-inputs
          path: ${{ runner.temp }}/paintsync-plugins-113
          retention-days: 2
          if-no-files-found: error
  verify-windows:
    needs: stage-release-files
    runs-on: windows-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-plugin-release-inputs
          path: ${{ runner.temp }}/paintsync-plugins-113
      - name: Install public signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Verify signed plugin upgrade, running editor protection, repair, and app data
        env:
          PLUGIN_EXPECTED: '{"PaintSync-Plugins-1.1.3.exe": "217c42518651c756d04819e0ff02f18c0c73ab6ac4e61e314037598154be2215", "appcast.xml": "fc3de834a8e54ba11ad65b3f1823b0cb9204550fd4f6af83792251a2d3394384", "Read-Me.txt": "68d3fb900635e32f46063b9ee2e9ea2aec6320060290742033a3abee1c36100a", "SHA256SUMS.txt": "9a3490ec00d4120fc9940fdc7770b3024ab43d235ffb90bfc86b92d3ed6a3cbc"}'
        shell: python
        run: |
          """Verify the installer on a disposable Windows runner with read-only GitHub access."""

          import base64
          import configparser
          import ctypes
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import time
          import winreg
          import xml.etree.ElementTree as ET
          import zipfile
          from ctypes import wintypes
          from pathlib import Path

          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          assert os.name == 'nt' and os.environ.get('GITHUB_ACTIONS') == 'true'
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'arcdtrade/PaintSync-Releases'
          root = Path(os.environ['RUNNER_TEMP']) / 'paintsync-plugins-113'
          install = Path(os.environ['LOCALAPPDATA']) / 'Programs/PaintSync'
          data = Path(os.environ['LOCALAPPDATA']) / 'PaintRelay'
          files = root / 'candidate'
          bundle = files / 'PaintSync-Plugins-1.1.3.exe'
          previous_app = root / 'PaintSync-Setup-1.0.27.exe'
          previous_bundle = root / 'PaintSync-Plugins-1.1.2.exe'
          older_app = root / 'PaintSync-Setup-1.0.24.exe'
          metadata = install / 'Plugins/Versions.ini'
          old_ccx = install / 'Plugins/PaintSync-Desktop-Link-1.0.4.ccx'
          new_ccx = install / 'Plugins/PaintSync-Desktop-Link-1.0.5.ccx'
          registry = r'Software\PaintSync\Setup'


          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def run_setup(executable, *args, expected=0):
              result = subprocess.run([str(executable), '/S', *args], timeout=100)
              assert result.returncode == expected, (executable.name, result.returncode, expected)


          def plugin_versions():
              config = configparser.ConfigParser()
              config.read(metadata, encoding='ascii')
              return config


          def configure_editor(name, enabled):
              with winreg.OpenKey(winreg.HKEY_CURRENT_USER, registry, 0, winreg.KEY_SET_VALUE) as key:
                  winreg.SetValueEx(key, name, 0, winreg.REG_DWORD, int(enabled))


          assert digest(previous_bundle) == 'c719b2dbce7253213be0b0f67de6d88ada3022a7a164ee768d0defe1f338318f'
          assert digest(previous_app) == 'e318638f89a33cad7c30a30e1d41cfe66dca41cf5c8a13ecec5ac5aff979c4b3'
          assert digest(older_app) == '9f88eb90d3507549e89916d5d25cde2d7ba87dc882241940b6e26c034c525d37'
          expected = json.loads(os.environ['PLUGIN_EXPECTED'])
          for name, sha in expected.items():
              assert digest(files / name) == sha, name
          ns = '{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          item = ET.fromstring((files / 'appcast.xml').read_bytes()).find('channel/item')
          enclosure = item.find('enclosure')
          assert item.findtext(ns + 'version') == '1.1.3'
          assert enclosure.get('url') == f'https://github.com/{repo}/releases/download/plugins-1.1.3/{bundle.name}'
          assert enclosure.get(ns + 'installerArguments') == '/UPDATE'
          assert enclosure.get(ns + 'os') == 'windows-x64'
          assert int(enclosure.get('length')) == bundle.stat().st_size
          public = base64.b64decode('VMLVwz8SJ4lwAMi9clASezBmvJEGIqqjgjkziTF5Lwk=')
          Ed25519PublicKey.from_public_bytes(public).verify(
              base64.b64decode(enclosure.get(ns + 'edSignature')), bundle.read_bytes()
          )

          assert not (install / 'PaintSync.exe').exists()
          run_setup(bundle, '/PLUGINS=none', expected=18)
          data.mkdir(parents=True, exist_ok=True)
          settings = data / 'settings.ini'
          settings.write_text(
              '[App]\nCustomerID=123456\n[Appearance]\nLanguage=en\n[Updates]\nAutomatic=0\n'
              '[PluginReleaseFixture]\nPreserve=Yes\n',
              encoding='utf-16',
          )
          run_setup(older_app, '/ID=123456', '/LANG=en', '/PLUGINS=none')
          old_app_digest = digest(install / 'PaintSync.exe')
          run_setup(bundle, '/UPDATE', '/PLUGINS=none', expected=18)
          assert digest(install / 'PaintSync.exe') == old_app_digest
          run_setup(previous_app, '/UPDATE', '/PLUGINS=none')
          assert plugin_versions()['Bundle']['Version'] == '1.1.2'
          assert plugin_versions()['Links']['Photoshop'] == '1.0.4'
          assert old_ccx.is_file()

          license_file = data / 'license.key'
          license_file.write_bytes(b'Preserve the installed key bytes')
          protected_license = data / 'polar-license.dat'
          protected_license.write_bytes(b'Preserve the local license cache bytes')
          paint_file = root / 'iRacing/paint/sentinel.tga'
          paint_file.parent.mkdir(parents=True)
          paint_file.write_bytes(b'Preserve the customer artwork bytes')
          contacts = Path(os.environ['LOCALAPPDATA']) / 'PaintSyncTransfer/regulars.dat'
          contacts.parent.mkdir(exist_ok=True)
          contacts.write_bytes(b'Preserve the existing sharing contacts bytes')

          watched = [
              install / 'PaintSync.exe', install / 'WinSparkle.dll',
              install / 'PaintSyncPluginUpdater.exe', install / 'Uninstall.exe',
              install / 'PaintSyncTransfer.dll', install / 'Receiver/PaintSync-Receiver-1.0.0.zip',
              install / 'Read-Me.txt', settings, license_file, protected_license, paint_file, contacts,
          ]
          protected = {path: digest(path) for path in watched}


          def unchanged():
              assert {path: digest(path) for path in watched} == protected
              with winreg.OpenKey(winreg.HKEY_CURRENT_USER, registry) as key:
                  assert winreg.QueryValueEx(key, 'InstalledVersion')[0] == '1.0.27'
              uninstall = r'Software\Microsoft\Windows\CurrentVersion\Uninstall\PaintSync'
              with winreg.OpenKey(winreg.HKEY_CURRENT_USER, uninstall) as key:
                  assert winreg.QueryValueEx(key, 'DisplayVersion')[0] == '1.0.27'


          run_setup(previous_bundle, '/UPDATE', '/PLUGINS=none')
          assert any(
              path.read_bytes() == metadata.read_bytes()
              for path in (install / 'PluginBackups').glob('previous-*/Versions.ini')
          ), 'Published plugin installer did not stage the 1.1.2 bundle on the shipped app'
          unchanged()
          assert plugin_versions()['Bundle']['Version'] == '1.1.2'
          assert plugin_versions()['Links']['Photoshop'] == '1.0.4'
          assert old_ccx.is_file() and not new_ccx.exists()
          with zipfile.ZipFile(old_ccx) as archive:
              assert json.loads(archive.read('manifest.json'))['version'] == '1.0.4'
          print('PASS exact published plugin 1.1.2 installed on the public 1.0.27 app.')

          check_files = root / 'photoshop-setup'
          check_files.mkdir()
          shutil.copyfile(old_ccx, check_files / old_ccx.name)
          before_metadata = metadata.read_bytes()
          before_ccx = digest(old_ccx)
          backups = install / 'PluginBackups'
          earlier_backups = set(backups.glob('previous-*/Versions.ini'))


          def simulate_open_editor(name, args, verify_intact):
              fake = root / (name + '.exe')
              shutil.copyfile(Path(os.environ['SystemRoot']) / 'System32/ping.exe', fake)
              proc = subprocess.Popen([str(fake), '-t', '127.0.0.1'], stdout=subprocess.DEVNULL)
              try:
                  time.sleep(.35)
                  run_setup(bundle, '/UPDATE', *args, expected=16)
                  assert proc.poll() is None, 'Setup closed an editor on its own'
                  verify_intact()
                  unchanged()
              finally:
                  if proc.poll() is None:
                      proc.terminate()
                  proc.wait(timeout=8)


          def previous_links_intact():
              assert metadata.read_bytes() == before_metadata
              assert digest(old_ccx) == before_ccx and not new_ccx.exists()


          configure_editor('Photoshop', True)
          simulate_open_editor('Photoshop', (), previous_links_intact)
          configure_editor('Photoshop', False)
          simulate_open_editor('Affinity', ('/PLUGINS=none',), previous_links_intact)
          print('PASS Photoshop and Affinity close prompts leave the old bundle and all user data intact.')

          run_setup(bundle, '/UPDATE', '/PLUGINS=none')
          unchanged()
          new_versions = plugin_versions()
          assert dict(new_versions['Bundle']) == {
              'version': '1.1.3', 'api': '2', 'minapp': '1.0.25', 'maxapp': '2.0.0',
          }
          assert dict(new_versions['Links']) == {
              'photoshop': '1.0.5', 'illustrator': '1.0.1', 'gimp': '0.1.6',
              'affinity': '1.1.0', 'imagelink': '1.0.0',
          }
          assert new_ccx.is_file() and not old_ccx.exists()
          with zipfile.ZipFile(new_ccx) as archive:
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['id'] == 'com.drewtrader.paintsync.photoshop'
              assert manifest['version'] == '1.0.5'
              assert manifest['host']['minVersion'] == '25.10.0'
              hashes = json.loads((install / 'Plugins/AdobeLinkFiles.json').read_text(encoding='utf-8'))
              assert hashes['PhotoshopVersion'] == '1.0.5'
              assert hashes['Photoshop'] == {
                  name: hashlib.sha256(archive.read(name)).hexdigest() for name in archive.namelist()
              }
          assert any(
              version.read_bytes() == before_metadata
              and (version.parent / old_ccx.name).is_file()
              and digest(version.parent / old_ccx.name) == before_ccx
              for version in set(backups.glob('previous-*/Versions.ini')) - earlier_backups
          )
          print('PASS published 1.1.2 to 1.1.3 upgrade installs the exact Photoshop 1.0.5 CCX and backs up the old bundle.')

          stable_metadata = metadata.read_bytes()
          stable_ccx = new_ccx.read_bytes()
          kernel = ctypes.WinDLL('kernel32', use_last_error=True)
          kernel.CreateFileW.argtypes = [
              wintypes.LPCWSTR, wintypes.DWORD, wintypes.DWORD, ctypes.c_void_p,
              wintypes.DWORD, wintypes.DWORD, wintypes.HANDLE,
          ]
          kernel.CreateFileW.restype = wintypes.HANDLE
          kernel.CloseHandle.argtypes = [wintypes.HANDLE]
          lock = kernel.CreateFileW(str(install / 'Plugins'), 0x80000000, 3, None, 3, 0x02000000, None)
          assert lock != wintypes.HANDLE(-1).value
          try:
              run_setup(bundle, '/UPDATE', '/PLUGINS=none', expected=20)
              assert metadata.read_bytes() == stable_metadata and new_ccx.read_bytes() == stable_ccx
              unchanged()
          finally:
              kernel.CloseHandle(lock)
          assert not list(install.glob('Plugins.pending-*'))
          new_ccx.write_bytes(b'Broken package fixture')
          run_setup(bundle, '/UPDATE', '/PLUGINS=none')
          assert metadata.read_bytes() == stable_metadata and new_ccx.read_bytes() == stable_ccx
          unchanged()
          print('PASS locked-folder rollback preserves the installed files and retry repairs a damaged CCX.')

          marker = install / 'Plugins/keep-newer.txt'
          marker.write_text('Keep the newer compatible package', encoding='ascii')
          run_setup(previous_app, '/UPDATE', '/PLUGINS=none')
          assert marker.is_file() and metadata.read_bytes() == stable_metadata and new_ccx.read_bytes() == stable_ccx
          run_setup(previous_bundle, '/UPDATE', '/PLUGINS=none', expected=19)
          assert marker.is_file() and metadata.read_bytes() == stable_metadata and new_ccx.read_bytes() == stable_ccx
          metadata.write_bytes(stable_metadata.replace(b'Version=1.1.3', b'Version=1.1.4', 1))
          run_setup(bundle, '/UPDATE', '/PLUGINS=none', expected=19)
          assert marker.is_file()
          metadata.write_bytes(stable_metadata)
          print('PASS previously shipped app installer preserves the new bundle and bundle downgrade is refused.')

          start_menu = Path(os.environ['APPDATA']) / 'Microsoft/Windows/Start Menu/Programs/PaintSync'
          shortcut = start_menu / 'Photoshop plugin setup.lnk'
          assert shortcut.is_file() and '1.0.5'.encode('utf-16le') in shortcut.read_bytes()
          for name in ('AdobeLinkFiles.json', 'AdobeLinkCheck.ps1', 'Install-Photoshop-Link.ps1', new_ccx.name):
              shutil.copyfile(install / 'Plugins' / name, check_files / name)

          run_setup(install / 'Uninstall.exe')
          for _ in range(100):
              if not any((install / name).exists() for name in ['PaintSync.exe', 'Plugins', 'PluginBackups']):
                  break
              time.sleep(.2)
          assert not any((install / name).exists() for name in ['PaintSync.exe', 'Plugins', 'PluginBackups'])
          assert all(digest(path) == protected[path] for path in (license_file, protected_license, paint_file, contacts))
          assert 'Preserve=Yes' in settings.read_text(encoding='utf-16')
          print('PASS removal cleans plugin files while leaving the paint, activation, settings, and contacts.')
      - name: Verify shipped Photoshop migration and file validation
        shell: powershell
        run: |
          # Test the shipped Adobe migration and exact-file validation in a disposable runner.
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:GITHUB_REPOSITORY -ne 'arcdtrade/PaintSync-Releases') {
              throw 'Use a disposable PaintSync GitHub Windows runner for this check.'
          }
          $root = Join-Path $env:RUNNER_TEMP 'paintsync-plugins-113'
          $setupFiles = Join-Path $root 'photoshop-setup'
          $package = Join-Path $setupFiles 'PaintSync-Desktop-Link-1.0.5.ccx'
          $previousPackage = Join-Path $setupFiles 'PaintSync-Desktop-Link-1.0.4.ccx'
          $setupScript = Join-Path $setupFiles 'Install-Photoshop-Link.ps1'
          $verifier = Join-Path $setupFiles 'AdobeLinkCheck.ps1'
          . $setupScript -PackageVersion '1.0.5'

          $external = Join-Path $env:APPDATA 'Adobe\UXP\Plugins\External'
          $fixtureLegacyPath = Join-Path $external 'com.drewtrader.paintrelay_2.2.9'
          $stable = Join-Path $external 'com.drewtrader.paintsync.photoshop_1.0.5'
          $previousStable = Join-Path $external 'com.drewtrader.paintsync.photoshop_1.0.4'
          if ((Test-Path -LiteralPath $fixtureLegacyPath) -or (Test-Path -LiteralPath $stable) -or (Test-Path -LiteralPath $previousStable)) {
              throw 'Unexpected installed Photoshop link on the disposable runner.'
          }
          New-Item -ItemType Directory -Path $fixtureLegacyPath -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($previousPackage, $previousStable)
          '{"id":"com.drewtrader.paintrelay","name":"PaintSync for iRacing","version":"2.2.9"}' |
              Set-Content -LiteralPath (Join-Path $fixtureLegacyPath 'manifest.json') -Encoding ascii

          $agent = Join-Path $root 'AdobeInstallerTest.ps1'
          @'
          param($Operation, $Product)
          if ($Operation -eq '/install') {
              if ($Product -ne $package) { throw 'Install did not select the signed 1.0.5 CCX.' }
              if ($simulatedCode -ne 0) { exit $simulatedCode }
              if (!(Test-Path -LiteralPath $stable)) {
                  Add-Type -AssemblyName System.IO.Compression.FileSystem
                  [IO.Compression.ZipFile]::ExtractToDirectory($package, $stable)
              }
              if (Test-Path -LiteralPath $previousStable) {
                  Rename-Item -LiteralPath $previousStable -NewName 'superseded-stable-test-package'
              }
              exit 0
          }
          if ($Operation -ne '/remove' -or $Product -cne 'PaintSync for iRacing' -or !(Test-Path -LiteralPath $stable)) {
              throw 'The old panel may only be retired after a successful replacement.'
          }
          if ($keepLegacy) { exit 1 }
          Rename-Item -LiteralPath $fixtureLegacyPath -NewName 'retired-test-package'
          exit 0
          '@ | Set-Content -LiteralPath $agent -Encoding ascii

          $simulatedCode = -456
          $keepLegacy = $false
          if ((Install-DesktopLink $agent $package $external) -ne 2 -or !(Test-Path -LiteralPath $fixtureLegacyPath) -or
              !(Test-Path -LiteralPath $previousStable) -or (Test-Path -LiteralPath $stable)) {
              throw 'A failed Adobe install must keep both existing panels.'
          }
          $simulatedCode = 0
          $keepLegacy = $true
          if ((Install-DesktopLink $agent $package $external) -ne 3 -or !(Test-Path -LiteralPath $stable) -or
              (Test-Path -LiteralPath $previousStable)) {
              throw 'Failure to retire an older link must report an actionable status.'
          }
          & $verifier -Action VerifyPhotoshop -Editors 1
          if ($LASTEXITCODE -ne 0) { throw 'The newly extracted CCX must pass the shipped Photoshop file verifier.' }

          $keepLegacy = $false
          $simulatedCode = -412
          if ((Install-DesktopLink $agent $package $external) -ne 0 -or (Test-Path -LiteralPath $fixtureLegacyPath)) {
              throw 'Retry must accept the exact installed 1.0.5 link and retire the legacy panel.'
          }

          $target = Join-Path $stable 'link.js'
          $link = [IO.File]::ReadAllBytes($target)
          try {
              [IO.File]::WriteAllText($target, 'Damaged link fixture')
              & $verifier -Action VerifyPhotoshop -Editors 1
              if ($LASTEXITCODE -ne 2) { throw 'The shipped verifier accepted a modified link file.' }
          } finally {
              [IO.File]::WriteAllBytes($target, $link)
          }
          & $verifier -Action VerifyPhotoshop -Editors 1
          if ($LASTEXITCODE -ne 0) { throw 'The restored link should pass validation.' }
          Write-Output 'PASS shipped Photoshop migration helper keeps the old panel on failure, recovers on retry, and verifies the exact 1.0.5 files. Adobe installer responses were simulated.'
  publish-verified-plugin:
    needs: verify-windows
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - name: Install public signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Publish verified plugin and switch its signed feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          expected = {'PaintSync-Plugins-1.1.3.exe': '217c42518651c756d04819e0ff02f18c0c73ab6ac4e61e314037598154be2215', 'appcast.xml': 'fc3de834a8e54ba11ad65b3f1823b0cb9204550fd4f6af83792251a2d3394384', 'Read-Me.txt': '68d3fb900635e32f46063b9ee2e9ea2aec6320060290742033a3abee1c36100a', 'SHA256SUMS.txt': '9a3490ec00d4120fc9940fdc7770b3024ab43d235ffb90bfc86b92d3ed6a3cbc'}
          previous_feed = '616921f1a7e85492ad540c8cd77a540334c0eb0022ab52db18df1cc0fa2b0fc0'
          release_id = 453907402
          import hashlib, json, os, subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']; assert repo == 'arcdtrade/PaintSync-Releases'
          tag = 'plugins-1.1.3'
          title = 'PaintSync Plugins 1.1.3'
          channel_tag = 'plugins-v2-channel'
          installer = 'PaintSync-Plugins-1.1.3.exe'
          feed = 'appcast.xml'

          def gh(*args):
              return subprocess.check_output(['gh', *map(str, args)], text=True, timeout=120).strip()

          def release_for_tag(wanted):
              release = json.loads(gh('api', f'repos/{repo}/releases/tags/{wanted}'))
              assert release['tag_name'] == wanted and not release['draft']
              return release

          def assets_by_name(release):
              assets = {asset['name']: asset for asset in release['assets']}
              assert len(assets) == len(release['assets']), 'Duplicate release asset names'
              return assets

          def candidate_release():
              pages = json.loads(gh('api', '--paginate', '--slurp', f'repos/{repo}/releases?per_page=100'))
              matches = [r for page in pages for r in page if r['name'] == title or r['tag_name'] == tag]
              assert len(matches) == 1, 'Expected exactly one release or draft for plugin version 1.1.3'
              release = matches[0]
              assert release['name'] == title and release['id'] == release_id
              assert release['tag_name'] == tag or (release['draft'] and release['tag_name'].startswith('untagged-'))
              assets = assets_by_name(release)
              assert set(assets) == set(expected), 'The release asset set differs from the approved version'
              for name, digest in expected.items():
                  assert assets[name]['state'] == 'uploaded' and assets[name]['digest'] == 'sha256:' + digest, name
              return release, assets

          def download_asset(asset, path, digest):
              assert asset['state'] == 'uploaded' and asset['digest'] == 'sha256:' + digest, path.name
              with path.open('wb') as handle:
                  subprocess.run(
                      ['gh', 'api', f"repos/{repo}/releases/assets/{asset['id']}", '-H', 'Accept: application/octet-stream'],
                      stdout=handle, check=True, timeout=120,
                  )
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, path.name

          def channel_assets():
              return assets_by_name(release_for_tag(channel_tag))

          def has_hash(asset, digest):
              return asset is not None and asset['state'] == 'uploaded' and asset['digest'] == 'sha256:' + digest
          import base64, time, urllib.request, xml.etree.ElementTree as ET
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          root = Path(os.environ['RUNNER_TEMP']) / 'publish-plugins-113'; root.mkdir()
          release, assets = candidate_release()
          for name, digest in expected.items():
              download_asset(assets[name], root / name, digest)
          feed_bytes = (root / feed).read_bytes()
          ns = '{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          item = ET.fromstring(feed_bytes).find('channel/item')
          enclosure = item.find('enclosure')
          assert item.findtext(ns + 'version') == '1.1.3'
          assert enclosure.get(ns + 'installerArguments') == '/UPDATE'
          assert enclosure.get(ns + 'os') == 'windows-x64'
          base_url = f'https://github.com/{repo}/releases/download'
          installer_url = f'{base_url}/{tag}/{installer}'
          assert enclosure.get('url') == installer_url
          raw = (root / installer).read_bytes()
          assert int(enclosure.get('length')) == len(raw)
          public_key = base64.b64decode('VMLVwz8SJ4lwAMi9clASezBmvJEGIqqjgjkziTF5Lwk=')
          Ed25519PublicKey.from_public_bytes(public_key).verify(
              base64.b64decode(enclosure.get(ns + 'edSignature')), raw
          )

          def public(url, max_bytes):
              request = urllib.request.Request(url, headers={'User-Agent': 'PaintSync-Release-Verification'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read(max_bytes + 1)

          def wait_for_hash(url, digest, max_bytes, attempts):
              for attempt in range(attempts):
                  try:
                      if hashlib.sha256(public(url, max_bytes)).hexdigest() == digest:
                          return
                  except OSError:
                      if attempt == attempts - 1:
                          raise
                  if attempt < attempts - 1:
                      time.sleep(5)
              raise AssertionError(f'Public release artifact does not match the verified bytes: {url}')

          retired = 'appcast-1.1.2.xml'
          staged = 'appcast-1.1.3.xml'
          live_url = f'{base_url}/{channel_tag}/{feed}'
          new_digest = expected[feed]

          def rename_asset(asset, name):
              gh('api', '--method', 'PATCH', f"repos/{repo}/releases/assets/{asset['id']}", '-f', 'name=' + name)

          channel = channel_assets()
          active = channel.get(feed)
          if active is None:
              assert has_hash(channel.get(retired), previous_feed) and has_hash(channel.get(staged), new_digest)
              rename_asset(channel[retired], feed)
              channel = channel_assets()
              active = channel.get(feed)
          if has_hash(active, new_digest):
              assert has_hash(channel.get(retired), previous_feed), 'Active candidate has no matching rollback archive'
          else:
              assert has_hash(active, previous_feed), 'The active plugin feed changed; stop before publication'
              assert retired not in channel, 'An existing rollback archive would be overwritten'
              assert staged not in channel or has_hash(channel[staged], new_digest), 'Existing staged feed differs'

          if release['draft']:
              gh('api', '--method', 'PATCH', f"repos/{repo}/releases/{release['id']}",
                 '-f', 'tag_name=' + tag, '-F', 'draft=false', '-F', 'prerelease=false', '-f', 'make_latest=false')
          release, _ = candidate_release()
          assert not release['draft'] and not release['prerelease']
          assert json.loads(gh('api', f'repos/{repo}/releases/latest'))['tag_name'] != tag, 'Plugin release became the app download'
          wait_for_hash(installer_url, expected[installer], len(raw), attempts=12)
          wait_for_hash(f'{base_url}/{tag}/{feed}', new_digest, 65536, attempts=12)

          if has_hash(active, previous_feed):
              if staged not in channel:
                  (root / staged).write_bytes(feed_bytes)
                  gh('release', 'upload', channel_tag, root / staged, '--repo', repo)
              channel = channel_assets()
              assert has_hash(channel.get(feed), previous_feed) and channel[feed]['id'] == active['id']
              assert retired not in channel and has_hash(channel.get(staged), new_digest)
              ready = channel[staged]
              try:
                  rename_asset(active, retired)
                  rename_asset(ready, feed)
              except (subprocess.SubprocessError, OSError):
                  after = channel_assets(); current = after.get(feed)
                  if current is None and has_hash(after.get(retired), previous_feed):
                      assert after[retired]['id'] == active['id']
                      rename_asset(after[retired], feed)
                      print('Restored the former active feed after a failed switch.')
                      raise
                  if not has_hash(current, new_digest) or current['id'] != ready['id']:
                      raise
          channel = channel_assets()
          assert has_hash(channel.get(feed), new_digest) and has_hash(channel.get(retired), previous_feed)
          wait_for_hash(live_url, new_digest, 65536, attempts=30)
          print(f'PASS Windows-verified plugin 1.1.3 published, signed feed live, previous feed retained. {live_url}')

