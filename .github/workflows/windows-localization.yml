name: Windows language and layout checks
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published beta installer to test
        required: true
        default: v0.5.6-beta
permissions:
  contents: read
jobs:
  languages-and-layout:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Download installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:RELEASE_REPO" --pattern 'PaintSync-Setup-*-Beta.exe' --dir "$env:RUNNER_TEMP\paintsync-test"
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
      - name: Check language picker, persistence and native page layout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public class PaintUI {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [StructLayout(LayoutKind.Sequential)] public struct Rect {public int l,t,r,b;}
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p,IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h,EnumProc p,IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint id);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder s,int n);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,StringBuilder s,int n);
            [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h,int id);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out Rect r);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern IntPtr SendMessageW(IntPtr h,uint m,IntPtr w,string l);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern IntPtr GetProp(IntPtr h,string name);
            [DllImport("user32.dll",CharSet=CharSet.Unicode,EntryPoint="SendMessageW")] public static extern IntPtr ReadItem(IntPtr h,uint m,IntPtr w,StringBuilder l);
            [DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint action,uint param,out int value,uint flags);
            public static string Item(IntPtr h,int i){var b=new StringBuilder(256);ReadItem(h,0x148,(IntPtr)i,b);return b.ToString();}
            public static string Text(IntPtr h){var s=new StringBuilder(2048);GetWindowText(h,s,2048);return s.ToString();}
            public static string Class(IntPtr h){var s=new StringBuilder(256);GetClassName(h,s,256);return s.ToString();}
            public static IntPtr Find(IntPtr parent,string text,bool className=false){IntPtr found=IntPtr.Zero;EnumChildWindows(parent,(h,l)=>{if((className?Class(h):Text(h))==text){found=h;return false;}return true;},IntPtr.Zero);return found;}
            public static IntPtr Window(uint pid,string prefix){IntPtr found=IntPtr.Zero;EnumWindows((h,l)=>{uint id;GetWindowThreadProcessId(h,out id);if(id==pid&&Text(h).StartsWith(prefix)){found=h;return false;}return true;},IntPtr.Zero);return found;}
            public static string All(IntPtr h){var a=new List<string>();EnumChildWindows(h,(c,l)=>{a.Add(Text(c));return true;},IntPtr.Zero);return String.Join("\n",a);}
            public static string ProcessText(uint pid){var a=new List<string>();EnumWindows((h,l)=>{uint id;GetWindowThreadProcessId(h,out id);if(id==pid){a.Add(Text(h));a.Add(All(h));}return true;},IntPtr.Zero);return String.Join("\n",a);}
            public static Rect Bounds(IntPtr h){Rect r;GetWindowRect(h,out r);return r;}
          }
          '@
          $setup=(Get-ChildItem "$env:RUNNER_TEMP\paintsync-test\*.exe").FullName
          $install=Join-Path $env:LOCALAPPDATA 'Programs\PaintSync'
          $data=Join-Path $env:USERPROFILE 'AppData\Local\PaintRelay'
          $ini=Join-Path $data 'settings.ini'
          $paint=Join-Path $env:RUNNER_TEMP 'iRacing\paint'
          New-Item -ItemType Directory -Force $data,$paint | Out-Null
          "[App]`r`nCustomerID=123456`r`nSeconds=0.5`r`nRoot=$paint`r`n[Appearance]`r`nTheme=2`r`n[Updates]`r`nAutomatic=0`r`n[Document.Test]`r`nVehicle=trucks fordf150`r`n" | Set-Content $ini -Encoding Unicode
          function Setup([string]$arguments,[int]$exit=0){$p=Start-Process $setup -ArgumentList $arguments -Wait -PassThru;if($p.ExitCode -ne $exit){throw "Setup exit $($p.ExitCode), expected $exit"}}
          function Assert-Language([string]$code){if((Get-Content $ini -Raw) -notmatch "(?m)^Language=$([regex]::Escape($code))\r?$"){Write-Output (Get-Content $ini -Raw);throw "Language not saved: $code"}}
          function Launch-App {
            $p=Start-Process "$install\PaintSync.exe" -PassThru
            for($i=0;$i -lt 40;$i++){Start-Sleep -Milliseconds 250;$p.Refresh();if($p.HasExited){throw 'App exited'};if($p.MainWindowHandle -ne 0){break}}
            if($p.MainWindowHandle -eq 0){throw 'Missing app window'}
            if([PaintUI]::Text($p.MainWindowHandle) -ne 'PaintSync'){throw 'Incorrect window title'}
            return $p
          }
          function Close-App($p){$p.CloseMainWindow() | Out-Null;if(!$p.WaitForExit(10000)){throw 'App did not close'}}
          # Interactive setup must ask for language before the welcome page.
          $picker=Start-Process $setup -ArgumentList '/ID=123456 /PLUGINS=none' -PassThru
          try {
            $h=[IntPtr]::Zero
            for($i=0;$i -lt 40;$i++){Start-Sleep -Milliseconds 250;$h=[PaintUI]::Window($picker.Id,'PaintSync — Language');if($h -ne 0){break}}
            if($h -eq 0){throw 'No installation language picker'}
            $combo=[PaintUI]::Find($h,'ComboBox',$true)
            $index=[PaintUI]::SendMessageW($combo,0x158,[IntPtr](-1),'Français').ToInt32()
            if($index -lt 0){throw 'French missing from language picker'}
            [PaintUI]::SendMessage($combo,0x14e,[IntPtr]$index,[IntPtr]::Zero) | Out-Null
            [PaintUI]::PostMessage([PaintUI]::GetDlgItem($h,1),0xf5,[IntPtr]::Zero,[IntPtr]::Zero) | Out-Null
            $welcome=''
            for($i=0;$i -lt 40;$i++){Start-Sleep -Milliseconds 250;$welcome=[PaintUI]::ProcessText($picker.Id);if($welcome.Contains('Installez PaintSync')){break}}
            if(!$welcome.Contains('Installez PaintSync')){Write-Output $welcome;throw 'Language picker did not translate the welcome page'}
            'PASS: interactive language picker and French welcome page.'
          } finally {if(!$picker.HasExited){Stop-Process -Id $picker.Id -Force;$picker.WaitForExit()}}
          $codes=@('en','es','fr','de','pt-BR','it')
          $paintLabels=@('Paint','Pintura','Peinture','Lackierung','Pintura','Vernice')
          $autosaveOff=@('Autosave · Off','Autoguardado · No','Sauvegarde auto · Non','Autospeichern · Aus','Salvar auto · Não','Salvataggio auto · No')
          $offline=@('Photoshop offline','Photoshop desconectado','Photoshop hors ligne','Photoshop offline','Photoshop desconectado','Photoshop non connesso')
          for($lang=0;$lang -lt $codes.Count;$lang++){
            $code=$codes[$lang]
            Setup "/S /ID=123456 /PLUGINS=none /LANG=$code"
            Assert-Language $code
            $expectedVersion=$env:RELEASE_TAG -replace '^v','' -replace '-beta$',''
            $vi=(Get-Item (Join-Path $install 'PaintSync.exe')).VersionInfo
            $numericVersion="$($vi.FileMajorPart).$($vi.FileMinorPart).$($vi.FileBuildPart)"
            if($numericVersion -ne $expectedVersion){throw 'Incorrect numeric file version'}
            $app=Launch-App
            try{
              $h=$app.MainWindowHandle
              if([PaintUI]::Text([PaintUI]::GetDlgItem($h,20)) -ne $paintLabels[$lang]){throw "App did not launch in $code"}
              $alert=[PaintUI]::GetDlgItem($h,30)
              if([PaintUI]::IsWindowVisible($alert)){throw 'Update badge visible before an update'}
              [PaintUI]::SendMessage($h,0x8035,[IntPtr]::Zero,[IntPtr]::Zero) | Out-Null
              if(![PaintUI]::IsWindowVisible($alert)){throw 'Missing update badge'}
              $badgeBounds=[PaintUI]::Bounds($alert);$appBounds=[PaintUI]::Bounds($h)
              if($badgeBounds.l -lt $appBounds.l+($appBounds.r-$appBounds.l)*0.8 -or $badgeBounds.b -gt $appBounds.t+150){throw 'Update badge is not upper-right'}
              $phase=[PaintUI]::GetProp($alert,'PR.updatePulse')
              $changed=$false
              for($tick=0;$tick -lt 20;$tick++){Start-Sleep -Milliseconds 100;if([PaintUI]::GetProp($alert,'PR.updatePulse') -ne $phase){$changed=$true;break}}
              $animations=1;[PaintUI]::SystemParametersInfo(0x1042,0,[ref]$animations,0) | Out-Null
              if($animations -ne 0 -and !$changed){throw 'Update badge did not pulse'}
              if($animations -eq 0 -and [PaintUI]::GetProp($alert,'PR.updatePulse') -ne 1){throw 'Reduced-animation badge not steady'}
              [PaintUI]::SendMessage($h,0x8034,[IntPtr]::Zero,[IntPtr]::Zero) | Out-Null
              if(![PaintUI]::IsWindowVisible($alert)){throw 'Dismissing update hid the badge'}
              if($code -eq 'en'){
                $types=[PaintUI]::GetDlgItem($h,6)
                $labels=@('Car · Sim Stamp','Car · Custom Number','Car · Spec Map','Car · Decal Mask')
                for($type=0;$type -lt 4;$type++){if([PaintUI]::Item($types,$type) -ne $labels[$type]){throw 'Incorrect paint-mode capitalization'}}
              }
              for($page=0;$page -lt 4;$page++){
                [PaintUI]::SendMessage($h,0x111,[IntPtr](20+$page),[IntPtr]::Zero) | Out-Null
                foreach($paintId in @(103,104,10,11,12,106)){
                  if([PaintUI]::IsWindowVisible([PaintUI]::GetDlgItem($h,$paintId)) -ne ($page -eq 0)){throw "Paint control $paintId visibility wrong on page $page"}
                }
                $auto=[PaintUI]::GetDlgItem($h,105)
                if(![PaintUI]::IsWindowVisible($auto) -or [PaintUI]::Text($auto) -ne $autosaveOff[$lang]){throw 'Persistent autosave indicator missing or incorrect'}
                $ab=[PaintUI]::Bounds($auto);$wb=[PaintUI]::Bounds($h)
                if($ab.t -lt $wb.t+($wb.b-$wb.t)*0.9){throw 'Autosave status not at bottom'}
              }
              if(![PaintUI]::IsWindowVisible($alert)){throw 'Update badge lost on page switch'}
              $theme=[PaintUI]::Bounds([PaintUI]::GetDlgItem($h,24))
              $language=[PaintUI]::Bounds([PaintUI]::GetDlgItem($h,29))
              $editor=[PaintUI]::Bounds([PaintUI]::GetDlgItem($h,25))
              $updates=[PaintUI]::Bounds([PaintUI]::GetDlgItem($h,28))
              $check=[PaintUI]::Bounds([PaintUI]::GetDlgItem($h,27))
              if($theme.t -ne $language.t -or $editor.t -le $theme.b -or $updates.t -le $editor.b -or $check.t -ne $updates.t){throw 'Settings groups are not ordered/aligned'}
              [PaintUI]::SendMessage($h,0x8036,[IntPtr]::Zero,[IntPtr]::Zero) | Out-Null
              if([PaintUI]::IsWindowVisible($alert)){throw 'No-update result did not clear the badge'}
              $badge=[PaintUI]::Find($h,$offline[$lang]);if($badge -eq 0){throw 'Missing localized connection status'}
              $r=[PaintUI]::Bounds($badge);$window=[PaintUI]::Bounds($h)
              if([Math]::Abs(($r.l+$r.r)-($window.l+$window.r)) -gt 4 -or $r.t -lt $window.t+($window.b-$window.t)*0.85){throw 'Connection status not bottom-center'}
              $choice=[PaintUI]::GetDlgItem($h,29)
              $next=($lang+1)%6
              $car=[PaintUI]::Text([PaintUI]::GetDlgItem($h,4));$id=[PaintUI]::Text([PaintUI]::GetDlgItem($h,5))
              [PaintUI]::SendMessage($choice,0x14e,[IntPtr]$next,[IntPtr]::Zero) | Out-Null
              [PaintUI]::SendMessage($h,0x111,[IntPtr](0x10000+29),$choice) | Out-Null
              "SWITCH: requested=$($codes[$next]); selection=$([PaintUI]::SendMessage($choice,0x147,[IntPtr]::Zero,[IntPtr]::Zero)); label=$([PaintUI]::Text([PaintUI]::GetDlgItem($h,20)))"
              Assert-Language $codes[$next]
              if([PaintUI]::Text([PaintUI]::GetDlgItem($h,20)) -ne $paintLabels[$next]){throw 'Language switch did not apply immediately'}
              if([PaintUI]::Text([PaintUI]::GetDlgItem($h,105)) -ne $autosaveOff[$next]){throw 'Autosave indicator did not translate'}
              if([PaintUI]::Text([PaintUI]::GetDlgItem($h,4)) -ne $car -or [PaintUI]::Text([PaintUI]::GetDlgItem($h,5)) -ne $id){throw 'Language switch changed paint settings'}
            }finally{Close-App $app}
            'UPDATE: preserving language after app close'
            Setup '/S /UPDATE /PLUGINS=none'
            Assert-Language $codes[$next]
            $app=Launch-App
            try{if([PaintUI]::Text([PaintUI]::GetDlgItem($app.MainWindowHandle,20)) -ne $paintLabels[$next]){throw 'Language lost after update/restart'}}finally{Close-App $app}
            "PASS: $code install; immediate language change; update and restart preserve choice; title, document visibility and bottom-center status."
          }
          $before=(Get-FileHash $ini).Hash
          Setup '/S /ID=123456 /PLUGINS=none /LANG=unknown' 14
          if((Get-FileHash $ini).Hash -ne $before){throw 'Invalid language changed settings'}
          foreach($value in @('CustomerID=123456','Seconds=0.5','Theme=2','Vehicle=trucks fordf150')){if(!(Get-Content $ini -Raw).Contains($value)){throw "Lost setting $value"}}
          'PASS: six installer languages; native language picker; immediate app switching; update/restart persistence; invalid-language rejection; paint-only document; clean title; bottom-center connection; numeric version; update badge visibility/pulse/dismissal/clear; paint-mode capitalization; Paint-only export controls; persistent autosave indicator; reorganized Settings.' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
